kind: table
name: natural_key_scalar
source:
  format: csv
  glob: "scalar_*.csv"
  natural_key: deposit_id
  expected_columns: [deposit_id, value]
layer1: {target: raw.natural_key_scalar}
layer2: {target: staging.natural_key_scalar, conflict_strategy: upsert_do_update}
layer3:
  - target: warehouse.fact_scalar
    strategy: fact_upsert
orchestration: {schedule: "@daily", start_date: "2024-01-01", catchup: false, tags: [test]}
