kind: table
name: client_deposit
source:
  format: json
  glob: "client_deposit.json"
  natural_key: [deposit_id]
  expected_columns: [deposit_id, client_id, deposit_date, amount_usd, payment_method,
                      currency_original, exchange_rate, status, processing_days, fee_usd]
  aliases: {credit_card: payment_method}
layer1: {target: raw.client_deposit}
layer2:
  target: staging.client_deposit
  conflict_strategy: upsert_do_update
  update_columns: [status, fee_usd]
layer3:
  - target: warehouse.fact_deposits
    strategy: fact_upsert
    columns: [amount_usd, exchange_rate, fee_usd, processing_days, payment_method,
              currency_original, status, is_late_arrival]
    event_date_column: deposit_date
    literals: {source_system: internal}
    fk_resolution: {dim_client: inferred_member_on_miss, risk_snapshot: snapshotted_fk}
orchestration: {schedule: "@daily", start_date: "2024-01-01", catchup: false, tags: [client]}
